<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShelfLife — System Architecture Diagram</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 700;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .diagram-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 96vw;
      width: 100%;
      box-sizing: border-box;
      overflow: auto;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <h1>ShelfLife — High-Level Architecture Diagram</h1>
    <p>High-resolution vector render of <code>docs/architecture.mmd</code></p>
    <div class="toolbar">
      <a href="architecture.svg" target="_blank" class="btn">Open Full Vector SVG</a>
      <a href="architecture.png" download class="btn btn-secondary">Download 3x HD PNG</a>
    </div>
  </header>

  <div class="diagram-container">
    <img src="architecture.svg" alt="ShelfLife System Architecture Diagram" id="diagram-img" />
  </div>
</body>
</html>
